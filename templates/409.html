{% extends 'base.html' %}
{% block title %}Conflict - 409{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
  <h1 style="font-size: 3rem; color: var(--warning); margin-bottom: 0.5rem;">409</h1>
  <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Action Conflict</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
    {{ message|default:"This project is archived and read-only, or a concurrency conflict occurred." }}
  </p>
  <a href="{% url 'projects:project_list' %}" class="btn btn-primary">Return to Projects</a>
</div>
{% endblock %}
