{% extends 'base.html' %}
{% block title %}Not Found - 404{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 3rem auto; text-align: center; padding: 2.5rem;">
  <h1 style="font-size: 3rem; color: var(--info); margin-bottom: 0.5rem;">404</h1>
  <h2 style="font-size: 1.25rem; margin-bottom: 1rem;">Resource Not Found</h2>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
    {{ message|default:"The requested project or task could not be found or you do not have permission to access it." }}
  </p>
  <a href="{% url 'projects:project_list' %}" class="btn btn-primary">Return to Projects</a>
</div>
{% endblock %}
